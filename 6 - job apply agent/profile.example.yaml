# ----------------------------------------------------------------------------
# Canonical job-application profile. Copy to profile.yaml and edit.
#
# Every field here corresponds to one or more keys that the form mapper knows
# how to fill on Greenhouse / Lever / Ashby applications. You can leave fields
# blank — they will simply be skipped during form fill.
# ----------------------------------------------------------------------------

basics:
  first_name: Muhammad Sharjeel
  last_name: Baig
  full_name: Muhammad Sharjeel Baig
  preferred_name: Sharjeel
  email: eng.sharjeel.baig@gmail.com
  phone: ""               # e.g. "+92 300 1234567"
  current_title: ""       # e.g. "Senior Software Engineer"
  current_company: ""

location:
  city: Lahore
  state: Punjab
  country: Pakistan
  willing_to_relocate: true
  remote_only: false

