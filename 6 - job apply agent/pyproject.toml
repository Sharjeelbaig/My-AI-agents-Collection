[project]
name = "6-job-apply-agent"
version = "0.1.0"
description = "Tool-heavy job application agent: parses your resume, finds open roles on Greenhouse/Lever/Ashby, fills the application forms with Playwright, and only consults an LLM for narrow decisions (job-fit + free-text answers)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.19",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.47",
    "pypdf>=4.3",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
anthropic = ["langchain-anthropic>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.6",
]
